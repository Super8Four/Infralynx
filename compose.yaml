name: infralynx

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infralynx}
      POSTGRES_USER: ${POSTGRES_USER:-infralynx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/db/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-infralynx}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-infralynx}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-secret-change-me-now}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-infralynx}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-infralynx}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-secret-change-me-now}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - file-storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  file-storage:
